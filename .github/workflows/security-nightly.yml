# A green pipeline yesterday says nothing about a CVE published today, so the
# released image is re-scanned on a schedule rather than only at build time.
name: security-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  rescan:
    name: Re-scan the published image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan of :latest
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true # report, do not fail the schedule
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
