# ---------------------------------------------------------------------------
# CI — everything that must be true before code can be released.
#
# Design notes:
#  * Jobs are parallel and independent; only `image` waits, because building a
#    container out of code that fails linting is wasted minutes.
#  * `permissions` is least-privilege at workflow level and widened per job.
#  * `concurrency` cancels superseded runs on the same branch: no queue of
#    stale builds burning runner minutes.
#  * Zero AWS credentials anywhere: moto emulates AWS for tests, LocalStack for
#    the Terraform plan.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint + format check)
        run: |
          ruff check --output-format=github app tests
          ruff format --check app tests

      - name: Mypy (strict)
        run: mypy app

      - name: Pytest
        # No AWS account needed: moto emulates DynamoDB and S3 in-process.
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # upload-sarif reads the workflow run to attach results
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs the full history

      - name: Secret scanning (gitleaks)
        # Run from the official image rather than a marketplace action: one
        # less third-party action in the supply chain, and no version pin to
        # go stale.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner --exit-code 1

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Dependency & filesystem scan (Trivy)
        # --exit-code 1 makes this the actual gate: a HIGH/CRITICAL finding
        # fails the build here, independently of whether the SARIF upload
        # below happens to work.
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif --output trivy-fs.sarif

      - name: Upload Trivy SARIF
        # Best-effort on purpose: code scanning requires GitHub Advanced
        # Security on private repositories, so this upload is a nice-to-have
        # (results in the Security tab) and must never be what fails CI.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # -------------------------------------------------------------------------
  iac:
    name: Terraform validate & plan
    runs-on: ubuntu-latest
    services:
      # A real LocalStack, so the plan is checked against an actual API rather
      # than only parsed. Catches provider/attribute mistakes a `validate`
      # would happily wave through.
      localstack:
        image: localstack/localstack:3.8
        ports: ["4566:4566"]
        env:
          SERVICES: s3,dynamodb,iam,sts,kms
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Static analysis (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          # Skipped with a reason, not silently: the bucket is deliberately
          # not fronted by a WAF/CloudFront in the challenge scope.
          skip_check: CKV_AWS_18,CKV2_AWS_62,CKV_AWS_144

      - name: Plan against LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan -var-file=envs/localstack.tfvars -input=false -no-color

  # -------------------------------------------------------------------------
  helm:
    name: Helm lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Lint every values overlay
        run: |
          for values in values.yaml values-localstack.yaml values-eks.yaml; do
            echo "::group::helm lint ($values)"
            helm lint deploy/helm/prima-api --strict \
              -f "deploy/helm/prima-api/${values}"
            echo "::endgroup::"
          done

      - name: Render manifests
        run: |
          helm template prima-api deploy/helm/prima-api \
            -f deploy/helm/prima-api/values-eks.yaml > rendered.yaml
          cat rendered.yaml

      - name: Validate against the Kubernetes API schema
        # Installed directly rather than through a third-party action: one less
        # supply-chain dependency, and the version is pinned explicitly.
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.30.0 rendered.yaml

      - name: Policy scan of the rendered manifests (Trivy config)
        # Catches privileged containers, missing probes, root users... on the
        # actual output rather than on the templates.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy config rendered.yaml --severity HIGH,CRITICAL --exit-code 1

  # -------------------------------------------------------------------------
  image:
    name: Build, scan & push image
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing with cosign
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Only on trusted refs: a PR from a fork must never get a push token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build (and push on trusted refs)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed cache keeps rebuilds to a few seconds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true # SLSA attestation
          sbom: true

      - name: Scan the built image (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          # A vulnerable image never reaches a release tag.
          trivy image "${REGISTRY}/${IMAGE_NAME}:sha-${{ github.sha }}" \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, OIDC)
        if: github.event_name != 'pull_request'
        # No private key to store or rotate: identity comes from the workflow's
        # OIDC token and lands in the public transparency log.
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # -------------------------------------------------------------------------
  smoke:
    name: End-to-end smoke test
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the full stack (LocalStack + provisioner + API)
        run: docker compose up --build -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health/ready >/dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API never became ready"; docker compose logs; exit 1

      - name: Run the smoke script
        run: ./scripts/smoke.sh http://localhost:8000

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
