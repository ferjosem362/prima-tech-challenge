# Keeping dependencies current is a security control, and grouping the updates
# is what stops it from becoming a PR firehose nobody reviews.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      # The base image tracks the newest CPython that pydantic-core publishes
      # wheels for (3.13 at the time of writing). Bumping past it makes pip
      # build the extension from source through Rust/PyO3, which fails.
      # Patch updates are still welcome; revisit when upstream ships wheels.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule: { interval: weekly }
