apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prima-api.fullname" . }}
  labels:
    {{- include "prima-api.labels" . | nindent 4 }}
data:
  # Mirrors app/core/config.py — every setting is an env var, nothing is baked
  # into the image, so the same digest is promoted across environments.
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  DEBUG_ERRORS: {{ .Values.app.debugErrors | quote }}
  # `int64` before `quote` is not decoration: Helm parses YAML numbers as
  # float64, so a bare `quote` renders 2097152 as "2.097152e+06" and the app
  # dies at startup failing to parse it as an integer.
  MAX_AVATAR_BYTES: {{ .Values.app.maxAvatarBytes | int64 | quote }}
  DEFAULT_PAGE_SIZE: {{ .Values.app.defaultPageSize | int64 | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  DYNAMODB_TABLE: {{ .Values.aws.dynamodbTable | quote }}
  S3_BUCKET: {{ .Values.aws.s3Bucket | quote }}
  {{- with .Values.aws.endpointUrl }}
  AWS_ENDPOINT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.aws.s3PublicBaseUrl }}
  S3_PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
