{{- if and .Values.aws.staticCredentials.enabled (not .Values.aws.staticCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prima-api.secretName" . }}
  labels:
    {{- include "prima-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LOCAL CLUSTERS ONLY (LocalStack). On EKS these keys must not exist: IRSA
  # delivers short-lived, automatically rotated credentials instead.
  # For real secrets outside AWS, use External Secrets Operator or SOPS —
  # never a plaintext value committed to a values file.
  AWS_ACCESS_KEY_ID: {{ .Values.aws.staticCredentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.staticCredentials.secretAccessKey | quote }}
{{- end }}
