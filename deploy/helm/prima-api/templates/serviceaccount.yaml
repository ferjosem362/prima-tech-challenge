{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prima-api.serviceAccountName" . }}
  labels:
    {{- include "prima-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # eks.amazonaws.com/role-arn here is the whole of IRSA: the EKS webhook
    # sees it and projects a signed token the pod exchanges for AWS credentials.
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API, so mounting its token would
# only widen the blast radius of a compromise.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
